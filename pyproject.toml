[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netscope"
version = "1.0.0"
description = "NetScope - Container Network Diagnostics Toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "docker>=7.0",
    "dnspython>=2.6",
    "httpx>=0.27",
    "psutil>=5.9",
]

[project.scripts]
netscope = "netscope.cli:main"

[tool.setuptools]
packages = ["netscope"]

[tool.setuptools.package-data]
netscope = ["static/*"]
